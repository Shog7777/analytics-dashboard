services:
  postgres:
    image: postgres:16-alpine
    container_name: analytics-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: analytics_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - analytics_dashboard_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics_dashboard"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  analytics_dashboard_data:
